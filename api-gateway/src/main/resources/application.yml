server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/products/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**
            
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**,/login,/refresh,/logout
        

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka