server:
  port: 9000

spring:
  application:
    name: auth-server
  datasource:
    url: jdbc:h2:mem:authdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
  jackson:
    serialization:
      indent-output: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.oauth2.server.authorization: DEBUG

auth-server:
  issuer: http://localhost:9000
  clients:
    - client-id: my-client
      client-secret: secret
      authentication-methods:
        - client_secret_basic
      grant-types:
        - authorization_code
        - refresh_token
      redirect-uris:
        - http://localhost:8080/login/oauth2/code/my-client
      scopes:
        - openid
        - api.read
    - client-id: service-client
      client-secret: service-secret
      authentication-methods:
        - client_secret_post
      grant-types:
        - client_credentials
      scopes:
        - api.internal
    - client-id: admin-console
      client-secret: admin-secret
      authentication-methods:
        - client_secret_basic
      grant-types:
        - authorization_code
        - refresh_token
        - client_credentials
      redirect-uris:
        - http://localhost:8081/login/oauth2/code/admin-console
      scopes:
        - openid
        - client.admin
