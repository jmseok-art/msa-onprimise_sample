name: Service build

on:
  push:
    branches:
      - main


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, user-service, product-service, order-service]  # repo 내 서비스 목록

    env:
      DEST: docker.io/jeongmin0709/${{ matrix.service }}:1.0.${{ github.run_number }}
      
    steps:
      - uses: actions/checkout@v3

      - name: Detect if service changed
        id: changed
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "^${{ matrix.service }}/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.changed.outputs.changed == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        if: steps.changed.outputs.changed == 'true'
        run: docker build -t $DEST ${{ matrix.service }}

      - name: Push Docker image
        if: steps.changed.outputs.changed == 'true'
        run: docker push $DEST

